<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
    <script src="js/horloge.js" defer></script>
    <script src="js/meteo.js" defer></script>
    <script src="js/programme.js" defer></script>
    <script src="js/sport.js" defer></script>
    <script src="js/vues.js" defer></script>
    <script src="js/calendrier.js" defer></script>
    <script src="js/ajout.js" defer></script>
    <script src="js/spotify.js" defer></script>
</head>
<body>
    <header>
        <h1>Mon dashboard</h1>
    </header>

    <main class="dashboard">

        <section class="horloge">
            <h2>Horloge</h2>
            <div class="palettes" id="heure">
            <span class="palette">0</span>
            <span class="palette">0</span>
            <span class="separateur">:</span>
            <span class="palette">0</span>
            <span class="palette">0</span>
            <span class="separateur">:</span>
            <span class="palette">0</span>
            <span class="palette">0</span>
            </div>

        </section>


        <section class="meteo">
            <h2>Météo</h2>
            <div class="meteo-carrousel">
                <button type="button" id="meteo-precedent">‹</button>
                <p id="meteo-ville">Saint Martin d'hères</p>
                <button type="button" id="meteo-suivant">›</button>
            </div>
            <p id="meteo-temperature">--</p>
            <p id="meteo-code">--</p>
            <p id="meteo-max">--</p>
            <p id="meteo-min">--</p>
            <p id="meteo-pluie-mm">--</p>
            <p id="meteo-pluie-proba">--</p>
        </section>

        <section class="programme">
            <h2>Programme</h2>
            <div class="programme-colonnes">

                <div class="programme-gauche">
                    <p id="date-du-jour">--</p>
                    <ul id="programme-liste"></ul>
                </div>

                <div class="programme-droite">
                    <div class="programme-carrousel">
                        <button type="button" id="programme-precedent">‹</button>
                        <p id="programme-onglet">Demain</p>
                        <button type="button" id="programme-suivant">›</button>
                    </div>

                    <div id="vue-demain">
                        <p id="date-demain">--</p>
                        <ul id="programme-demain"></ul>
                    </div>

                    <div id="vue-calendrier" hidden>
                        <p id="mois-annee">--</p>
                        <div id="calendrier-grille"></div>
                    </div>

                    <div id="vue-ajouter" hidden> 

                        <form id="formulaire-ajout">
                            <input type="date" id="date-ajout" required>
                            <div class="ajout-heures">
                                <input type="time" id="debut-ajout" required>
                                →
                                <input type="time" id="fin-ajout" required>
                            </div>
                            <input type="text" id="titre-ajout" placeholder="Titre" required>
                            <input type="text" id="lieu-ajout" placeholder="Lieu">
                            <div class="ajout-actions">
                                <button type="submit">Ajouter</button>
                                <p id="ajout-message"></p>
                            </div>
                        </form>

                    </div>

                </div>

            </div>
        </section>

        <section class="sport">
            <h2>Sport</h2>
            <p id="sport-titre">--</p>
            <ul id="sport-liste"></ul>
        </section>

        <section class="spotify">
            <h2>Spotify</h2>
            <ul>
                <li>Music : Filon, Ninho </li>
                <li>2:09/3:02</li>
            </ul>
        </section>

        <section class="mimir">
            <h2>Mimir</h2>
            <div class="mimir-logo">
                <img src="images/mimir.png" alt="Logo de Mimir">
            </div>
        </section>

    </main>

</body>
</html>
