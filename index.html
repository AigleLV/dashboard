<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
    <script src="js/horloge.js" defer></script>
    <script src="js/meteo.js" defer></script>
    <script src="js/programme.js" defer></script>
</head>
<body>
    <header>
        <h1>Mon dashboard</h1>
    </header>

    <main class="dashboard">

        <section class="horloge">
            <h2>Horloge</h2>
            <div class="palettes" id="heure">
            <span class="palette">0</span>
            <span class="palette">0</span>
            <span class="separateur">:</span>
            <span class="palette">0</span>
            <span class="palette">0</span>
            <span class="separateur">:</span>
            <span class="palette">0</span>
            <span class="palette">0</span>
            </div>

        </section>

        <section class="meteo">
            <h2>Météo</h2>
            <p id="meteo-ville">Saint Martin d'hères</p>
            <p id="meteo-temperature">--</p>
            <p id="meteo-code">--</p>
            <p id="meteo-max">--</p>
            <p id="meteo-min">--</p>
            <p id="meteo-pluie-mm">--</p>
            <p id="meteo-pluie-proba">--</p>
        </section>

        <section class="programme">
            <h2>Programme</h2>
                <p id="date-du-jour">--</p>
                <ul id="programme-liste"></ul>
        </section>

        <section class="sport">
            <h2>Sport</h2>
            <ul>
                <li>Pecs, epaule,</li>
                <li>Dos, bras</li>
                <li>Jambes</li>
            </ul>
        </section>

        <section class="spotify">
            <h2>Spotify</h2>
            <ul>
                <li>Music : Filon, Ninho </li>
                <li>2:09/3:02</li>
            </ul>
        </section>

        <section class="mimir">
            <h2>Mimir</h2>
            <ul>
                <li>Logo</li>
                <li>Quelle est ta question ? </li>
            </ul>
        </section>

    </main>

</body>
</html>
